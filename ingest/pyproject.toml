[project]
name = "waypoint-ingest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "hardy_patrick@yahoo.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "pyyaml>=6.0.3",
    "voyageai>=0.6.0",
]

[project.scripts]
ingest = "waypoint_ingest.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest]
testpaths = ["tests"]
# PyMuPDF's SWIG bindings and langsmith (via voyageai) warn on Python 3.14;
# not our code.
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
