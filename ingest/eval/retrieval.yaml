# Retrieval eval set: student questions and the sections that answer them.
#
# Written by hand from the TC AIM 2026-2 text. Each expected section was
# confirmed by reading it, never by running a search. A question lists every
# section that directly answers it; a hit on any of them counts.
#
# Excluded topics: icing reports, VFR cruising altitudes, wake turbulence,
# mandatory frequency procedures, and METAR/SPECI. Their search results were
# seen during the step 2 hand check, so questions on them would be biased.

- id: pstar-01
  exam: PSTAR
  subject: pstar
  question: My radio quits while I'm flying VFR inside a control zone. What am I supposed to do?
  expected: ["tc-aim:RAC 4.4.8"]

- id: pstar-02
  exam: PSTAR
