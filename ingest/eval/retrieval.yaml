# Retrieval eval set: student questions and the sections that answer them.
#
# Written by hand from the TC AIM 2026-2 text. Each expected section was
# confirmed by reading it, never by running a search. A question lists every
# section that directly answers it; a hit on any of them counts.
#
# Excluded topics: icing reports, VFR cruising altitudes, wake turbulence,
# mandatory frequency procedures, and METAR/SPECI. Their search results were
# seen during the step 2 hand check, so questions on them would be biased.
#
# Sources loaded in step 6 (TP 13723, TP 975, Standards 421 and 428, TP 14277,
# RIC-21 and the FAA handbooks) were judged by pooling: every unlabelled chunk
# from them that ranked in a question's top 5, above its first correct
# answer, was read and added only if it states the answer itself. FAA pages
# count only for facts that are not Canada-specific (physiology, physics,
# weather, instruments); never for rules, Canadian products or publications.
#
# CAR sections (cars:CAR x) were added when the CARs were loaded, found by
# keyword search of the regulation text and confirmed by reading, before the
# eval was re-run. A CAR section counts only if it states the answer itself;
# sections that defer to the Canada Flight Supplement (602.78, 602.144) do not.

