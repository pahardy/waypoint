- id: flight-test.ex02a
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 2 Aeroplane Familiarization and Preparation for Flight
  text: Documents and Airworthiness (Ground Item)
  detail: To correctly assess the validity of documents required on board and, from
    these documents, determine that the aircraft is airworthy for the proposed flight.
  ref: TP 13723 Ex. 2 A
  source: tp13723
  page: 18
- id: flight-test.ex02b
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 2 Aeroplane Familiarization and Preparation for Flight
  text: Aeroplane Performance (Ground Item)
  detail: To understand the recommended operating procedures, performance capabilities
    and approved limitations of the aeroplane being used for the flight test.
  ref: TP 13723 Ex. 2 B
  source: tp13723
  page: 18
- id: flight-test.ex02c
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 2 Aeroplane Familiarization and Preparation for Flight
  text: Weight and Balance, Loading (Ground Item)
  detail: To correctly complete two weight and balance calculations for the aeroplane
    used for the test, one for the planned simulated VFR cross-country flight prepared
    in Ex 23 A and the second calculation for the actual flight-test flight.
  ref: TP 13723 Ex. 2 C
  source: tp13723
  page: 19
- id: flight-test.ex02d
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 2 Aeroplane Familiarization and Preparation for Flight
  text: Pre-Flight Inspection (Air Item)
  detail: To complete internal and external checks in accordance with the POH/AFM
    and demonstrate practical knowledge of the aircraft to determine that the aeroplane
    is in a safe condition for the intended flight.
  ref: TP 13723 Ex. 2 D
  source: tp13723
  page: 19
- id: flight-test.ex02e
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 2 Aeroplane Familiarization and Preparation for Flight
  text: Engine Starting and Run-up, Use of Checklists
  detail: To complete engine start, warm-up, run-up, correctness of control movements
    and systems checks in accordance with the checklists or placards provided by the
    aircraft manufacturer or owner, completing at least those items in the POH/AFM
    to determine that the aeroplane is airworthy and ready for flight. 12
  ref: TP 13723 Ex. 2 E
  source: tp13723
  page: 20
- id: flight-test.ex02f
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 2 Aeroplane Familiarization and Preparation for Flight
  text: Operation of Aircraft Systems
  detail: To operate the installed aeroplane systems in accordance with the POH/AFM
    or manual supplements.
  ref: TP 13723 Ex. 2 F
  source: tp13723
  page: 21
- id: flight-test.ex04
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 4 Taxiing
  text: Taxiing
  detail: To safely manoeuvre the aeroplane safely and avoid unnecessary interference
    with movement of other traffic.
  ref: TP 13723 Ex. 4
  source: tp13723
  page: 22
- id: flight-test.ex09
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 9 Steep Turn
  text: Steep Turn
  detail: To safely perform a level and coordinated steep turn.
  ref: TP 13723 Ex. 9
  source: tp13723
  page: 22
- id: flight-test.ex11
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 11 Slow Flight
  text: Slow Flight
  detail: To establish the aircraft in slow flight on the backside of the power curve,
    where more power is needed to fly slower, as indicated by intermittent stall warnings
    or aerodynamic buffet, maintain flight control and to manoeuvre near that speed
    while preventing a stall, and to safely recover promptly and smoothly to normal
    flight on command of the examiner.
  ref: TP 13723 Ex. 11
  source: tp13723
  page: 23
- id: flight-test.ex12a
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 12 Stall
  text: Power-off
  detail: To recognize indications of the approach to arrival stalls, intentionally
    enter a full stall and safely execute a positive recovery to normal flight. 15
  ref: TP 13723 Ex. 12 A
  source: tp13723
  page: 23
- id: flight-test.ex12b
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 12 Stall
  text: Power-on
  detail: To recognize indications of the approach to departure or overshoot stalls
    with a high-power setting, but without excessively high nose-up attitudes and
    intentionally, execute a full stall and execute a positive recovery.
  ref: TP 13723 Ex. 12 B
  source: tp13723
  page: 24
- id: flight-test.ex14
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 14 Spiral
  text: Spiral
  detail: To determine that the candidate can recognize a spiral dive and can execute
    a smooth and safe recovery to straight and level flight.
  ref: TP 13723 Ex. 14
  source: tp13723
  page: 25
- id: flight-test.ex15
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 15 Slipping
  text: Slipping
  detail: To demonstrate safe and effective slipping manoeuvres to increase a rate
    of descent or for crosswind landing conditions.
  ref: TP 13723 Ex. 15
  source: tp13723
  page: 25
- id: flight-test.ex16a
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 16 Takeoff
  text: Normal Takeoff
  detail: To safely conduct a normal takeoff using the correct procedure and technique
    for the actual or simulated wind conditions, runway surface and length, and assess
    the possibility of further conditions such as wind shear and wake turbulence.
  ref: TP 13723 Ex. 16 A
  source: tp13723
  page: 26
- id: flight-test.ex16b1
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 16 Takeoff
  text: Short-Field Takeoff
  detail: To safely take off from a short field and clear an obstacle, using the correct
    procedure and technique for the actual or simulated wind conditions, runway length
    and obstacles to be cleared, and assess the possibility of further conditions
    such as wind shear and wake turbulence.
  ref: TP 13723 Ex. 16 B.1
  source: tp13723
  page: 27
- id: flight-test.ex16b2
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 16 Takeoff
  text: Soft-Field Takeoff
  detail: To determine that the candidate can safely take off from an actual or simulated
    grass, gravel or rough surface using the correct procedure and technique for the
    actual or simulated wind conditions, runway surface and length, and can assess
    the possibility of further conditions such as wind shear and mechanical turbulence.
  ref: TP 13723 Ex. 16 B.2
  source: tp13723
  page: 28
- id: flight-test.ex17
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 17 Circuit
  text: Circuit
  detail: To operate the aeroplane in a safe manner in the vicinity of a controlled
    and/or an uncontrolled aerodrome. 20
  ref: TP 13723 Ex. 17
  source: tp13723
  page: 28
- id: flight-test.ex18a
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 18 Approach and Landing
  text: Normal Approach and Landing
  detail: To safely execute a normal approach and landing with a degree of accuracy
    as recommended by the POH/AFM or the techniques in the Flight Training Manual.
  ref: TP 13723 Ex. 18 A
  source: tp13723
  page: 30
- id: flight-test.ex18b1
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 18 Approach and Landing
  text: Short-Field Approach and Landing over an Obstacle
  detail: To safely execute a short-field approach over an actual or simulated obstacle
    and land on a specified touchdown point with a degree of accuracy, using the technique
    recommended by the POH/AFM or to execute a soft-field landing using the techniques
    in the Flight Training Manual.
  ref: TP 13723 Ex. 18 B.1
  source: tp13723
  page: 31
- id: flight-test.ex18b2
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 18 Approach and Landing
  text: Soft-Field Approach and Landing
  detail: To safely execute a short-field approach over an actual or simulated obstacle
    and land on a specified touchdown point with a degree of accuracy, using the technique
    recommended by the POH/AFM or to execute a soft-field landing using the techniques
    in the Flight Training Manual.
  ref: TP 13723 Ex. 18 B.2
  source: tp13723
  page: 31
- id: flight-test.ex18c
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 18 Approach and Landing
  text: Overshoot
  detail: To safely execute an overshoot as recommended by the POH/AFM or the technique
    described in the Flight Training Manual.
  ref: TP 13723 Ex. 18 C
  source: tp13723
  page: 32
- id: flight-test.ex21
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 21 Precautionary Landing
  text: Precautionary Landing
  detail: To safely evaluate an unfamiliar aerodrome or landing area as a prospective
    place to land.
  ref: TP 13723 Ex. 21
  source: tp13723
  page: 32
- id: flight-test.ex22a
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 22 Forced Landing
  text: Control/Approach
  detail: To plan, manage and safely carry out a successful approach in the event
    of an engine failure to a selected touchdown zone in the first 1/3 of a suitable
    landing area.
  ref: TP 13723 Ex. 22 A
  source: tp13723
  page: 33
- id: flight-test.ex22b
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 22 Forced Landing
  text: Cockpit Management
  detail: To plan, manage and safely carry out a successful approach in the event
    of an engine failure to a selected touchdown zone in the first 1/3 of a suitable
    landing area.
  ref: TP 13723 Ex. 22 B
  source: tp13723
  page: 34
- id: flight-test.ex23a
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 23 Pilot Navigation
  text: Pre-Flight Planning Procedures (Ground Item)
  detail: To efficiently plan a VFR cross-country flight and demonstrate practical
    knowledge by explaining elements related to cross-country flight planning.
  ref: TP 13723 Ex. 23 A
  source: tp13723
  page: 34
- id: flight-test.ex23b
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 23 Pilot Navigation
  text: Departure Procedure
  detail: To safely execute an efficient departure for the simulated cross-country
    flight planned in Ex. 23A.
  ref: TP 13723 Ex. 23 B
  source: tp13723
  page: 35
- id: flight-test.ex23c
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 23 Pilot Navigation
  text: Enroute Procedure
  detail: To effectively apply systematic VFR navigation techniques in order to ensure
    that arrival at the destination is predictable.
  ref: TP 13723 Ex. 23 C
  source: tp13723
  page: 36
- id: flight-test.ex23d
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 23 Pilot Navigation
  text: Diversion to an Alternate
  detail: To safely carry out a diversion to a suitable alternate destination using
    mental in-flight planning, dead reckoning, map reading and pilotage.
  ref: TP 13723 Ex. 23 D
  source: tp13723
  page: 36
- id: flight-test.ex24a
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 24 Instrument Flying
  text: Full Panel
  detail: To safely control and manoeuvre the aeroplane solely by reference to available
    flight instruments. 29
  ref: TP 13723 Ex. 24 A
  source: tp13723
  page: 37
- id: flight-test.ex24b
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 24 Instrument Flying
  text: Recovery from Unusual Attitude
  detail: To safely and promptly recover from an abnormal attitude using only the
    available flight instruments.
  ref: TP 13723 Ex. 24 B
  source: tp13723
  page: 38
- id: flight-test.ex29
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 29 Emergency Procedures/Malfunctions
  text: Emergency Procedures/Malfunctions
  detail: To react promptly and correctly to actual or simulated emergencies and system
    or equipment malfunctions by carrying out vital action checks by memory and following
    up with the appropriate checklist.  Some checks may be actioned by reference to
    the appropriate checklist.
  ref: TP 13723 Ex. 29
  source: tp13723
  page: 38
- id: flight-test.ex30
  exam: FLIGHT_TEST
  subject: flight-test
  area: Flight Test Items
  topic: Ex. 30 Radio Communication
  text: Radio Communication
  detail: To communicate with Air Traffic Control (ATC) facilities in clear and understandable
    English or French, as appropriate to the location; to maintain a “listening watch”
    on the appropriate frequency applicable to the airspace and demonstrate how to
    obtain assistance from those facilities to permit the safe and efficient conduct
    of a flight.
  ref: TP 13723 Ex. 30
  source: tp13723
  page: 39
