  number: '14.01'
  objective_id: pstar.regulations.014
  stem: The primary objective of an aviation safety investigation into an aircraft accident or aircraft incident is to
  choices:
  - apportion blame and liability.
  - determine the adequacy of insurance regulations.
  - enforce regulations.
  - prevent recurrences.
