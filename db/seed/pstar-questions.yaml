- id: pstar-13.02
  number: '13.02'
  objective_id: pstar.regulations.013
  stem: When in VFR flight within controlled airspace, a pilot must remain clear of cloud by at least
  choices:
  - 500 feet vertically and 1 mile horizontally.
  - 500 feet vertically and 2,000 feet horizontally.
  - 1,000 feet vertically and 1 mile horizontally.
  - 1,000 feet vertically and 3 miles horizontally.
  answer_index: 0
  source: tp11919
  page: 46
- id: pstar-13.03
  number: '13.03'
  objective_id: pstar.regulations.013
  stem: The minimum flight visibility for VFR flight within a low level airway is
  choices:
  - 1 mile.
  - 1½ miles.
  - 2 miles.
  - 3 miles.
  answer_index: 3
  source: tp11919
  page: 46
- id: pstar-13.04
  number: '13.04'
  objective_id: pstar.regulations.013
  stem: When in VFR flight within a Control Zone, a pilot must remain clear of cloud by at least
  choices:
  - 500 feet vertically and 2,000 feet horizontally.
  - 500 feet vertically and 1 mile horizontally.
  - 1,000 feet vertically and 1 mile horizontally.
  - 1,000 feet vertically and 3 miles horizontally.
  answer_index: 1
  source: tp11919
  page: 46
- id: pstar-13.05
  number: '13.05'
  objective_id: pstar.regulations.013
  stem: VFR cross-country pilots wishing to cross through any part of a Class C Control Zone should
  choices:
  - advise the associated FSS.
  - monitor the Approach Control frequency.
  - advise ATC of their intentions and obtain a clearance.
  - conform with circuit direction at that airport.
  answer_index: 2
  source: tp11919
  page: 46
- id: pstar-13.06
  number: '13.06'
  objective_id: pstar.regulations.013
  stem: ATC may authorize an aircraft equipped with a functioning two-way radio to transit a Control Zone under day SVFR provided the flight visibility and, when reported, ground visibility, are each not less than
  choices:
