- id: pstar-13.01
  number: '13.01'
  objective_id: pstar.regulations.013
  stem: ‘Controlled Airspace’ means all airspace of defined dimensions within which
  choices:
  - Control Zone regulations are in force.
  - security regulations are in force.
  - Special VFR flight only is permitted.
  - an ATC service is provided.
