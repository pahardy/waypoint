  page: 47
- id: pstar-13.07
  number: '13.07'
  objective_id: pstar.regulations.013
  stem: ATC may authorize a helicopter equipped with a functioning two-way radio to transit a Control Zone under day SVFR where the flight visibility and, when reported, ground visibility are each not less than
  choices:
  - 1 mile and operated at not less than 500 feet AGL.
  - ½ mile.
  - 1 mile.
  - ½ mile and operated at not less than 500 feet AGL.
