- id: ppaer.aeronautics.032.q1
  exam: PPAER
  objective_id: ppaer.aeronautics.032
  stem: Which of the following is one of the functions of the engine oil system in a reciprocating
    aircraft engine?
  choices:
  - Raising the fuel-air mixture temperature in the induction system
  - Providing a seal between the cylinder walls and the pistons
  - Supplying electrical power to the magnetos
  - Increasing the octane rating of the fuel-air mixture
  answer_index: 1
  explanation: The engine oil system lubricates moving parts, reduces friction, removes heat
    from the cylinders, carries away contaminants and provides a seal between the cylinder
    walls and pistons (PHAK, Oil Systems). The other choices are not functions of the oil
    system.
  source_chunk_id: faa-phak:PHAK p.176:0
  status: reviewed
  check:
    answer_index: 1
    faa_as_canadian: false
    reason: The passage lists the engine oil system's functions. One of them is "Providing
      a seal between the cylinder walls and pistons," which matches choice 1. None of the
      other choices appear in that list. How engine oil systems work is general engine knowledge
      and does not depend on the regulator, so the FAA source is fine here.
