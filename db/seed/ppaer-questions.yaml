  stem: According to the TC AIM, a Canadian NOTAM subject is located 8 NM from the nearest
    aerodrome and does not directly affect any aerodrome. What does item A) of the NOTAM contain?
  choices:
  - The location indicator CXXX only
  - One or more flight information regions (FIR)
  - The latitude and longitude of the subject
  - The location indicator of the nearest aerodrome
  answer_index: 1
  explanation: Item A) contains an aerodrome location indicator or CXXX only if the subject
    affects an aerodrome directly or is 5 NM or less from one. If the subject is beyond 5
    NM from any aerodrome, item A) contains one or more FIRs (up to 7), per TC AIM MAP 3.4.
  source_chunk_id: tc-aim:MAP 3.4:0
  status: reviewed
  check:
    answer_index: 1
