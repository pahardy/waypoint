- id: ppaer.aeronautics.160.q1
  exam: PPAER
  objective_id: ppaer.aeronautics.160
  stem: Under CAR 705.56, when the maximum take-off weight is determined for an aeroplane,
    which wind component may be taken into account for the take-off performance calculation?
  choices:
  - Only the reported headwind component, with any tailwind ignored
  - 100 per cent of the reported headwind component and 100 per cent of the reported tailwind
    component
  - Not less than 150 per cent of the reported headwind component or not more than 50 per
    cent of the reported tailwind component
  - Not more than 50 per cent of the reported headwind component or not less than 150 per
    cent of the reported tailwind component
  answer_index: 3
  explanation: CAR 705.56(3)(d) requires that not more than 50 per cent of the reported headwind
