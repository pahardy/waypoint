      3. This is wind-triangle physics, which is the same everywhere, so using FAA material
      here is fine.
- id: ppaer.navigation.056.q1
  exam: PPAER
  objective_id: ppaer.navigation.056
  stem: A pilot sets 29.92 inches of mercury on the altimeter subscale. According to the TC
