- id: ppaer.aeronautics.104.q1
  exam: PPAER
  objective_id: ppaer.aeronautics.104
  stem: Which statement correctly describes the difference between indicated airspeed (IAS)
    and calibrated airspeed (CAS) on an airspeed indicator?
  choices:
  - CAS is IAS corrected for altitude and nonstandard temperature, and the error is generally
    greatest at high airspeeds
  - CAS is IAS adjusted for wind, and the error is generally greatest in the cruise speed
    range
  - CAS is IAS corrected for lag in the pressure lines, and the error is the same at all airspeeds
  - CAS is IAS corrected for installation error and instrument error, and the error is generally
    greatest at low airspeeds
  answer_index: 3
  explanation: Calibrated airspeed is IAS corrected for installation and instrument error.
    These errors are generally greatest at low airspeeds, and in cruise IAS and CAS are approximately
    the same (PHAK p.211, background on aerodynamics and instruments).
  source_chunk_id: faa-phak:PHAK p.211:0
  status: reviewed
  check:
    answer_index: 3
    faa_as_canadian: false
    reason: The passage defines CAS as IAS corrected for installation error and instrument
      error, and says this error is generally greatest at low airspeeds. That matches choice
      3. Choice 0 describes TAS (correction for altitude and temperature). Choice 1 describes
      groundspeed (adjustment for wind). Choice 2 contradicts the passage, which says the
      error varies with airspeed. These are instrument principles that are the same everywhere,
      so an FAA source is fine here.
