- id: ppaer.navigation.058.q1
  exam: PPAER
  objective_id: ppaer.navigation.058
  stem: An aircraft is flying at a constant ground speed of 140 knots. How long will it take
    to fly 210 nautical miles?
  choices:
  - 1 hour 30 minutes
  - 1 hour 45 minutes
  - 1 hour 15 minutes
  - 2 hours
  answer_index: 0
  explanation: 'Time equals distance divided by ground speed: 210 NM ÷ 140 kt = 1.5 hours,
    which is 1 hour 30 minutes. This is the basic time, speed and distance relationship (T
    = D/GS) described in the PHAK background passage, and it is the same in every country.'
  source_chunk_id: faa-phak:PHAK p.398:0
  status: reviewed
  check:
    answer_index: 0
    faa_as_canadian: false
    reason: 'The passage works this exact example: T = D/GS = 210 ÷ 140 = 1.5 hours, which
      is 1:30. Time-speed-distance arithmetic is the same everywhere, so an FAA source is
      fine here.'
