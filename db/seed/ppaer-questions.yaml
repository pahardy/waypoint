- id: ppaer.navigation.055.q1
  exam: PPAER
  objective_id: ppaer.navigation.055
  stem: An aircraft is flown in conditions where there is no wind. How do the aircraft's ground
    track and ground speed compare with its heading and true airspeed?
  choices:
  - Ground track differs from heading by the drift angle, and ground speed is the same as
    true airspeed
  - Ground track differs from heading by the variation, and ground speed is greater than true
    airspeed
  - Ground track is the same as heading, and ground speed is less than true airspeed
  - Ground track is the same as heading, and ground speed is the same as true airspeed
  answer_index: 3
  explanation: With no wind there is no drift and no wind effect on speed, so the track equals
    the heading and the ground speed equals the true airspeed. This is the wind triangle principle
    in the background passage (PHAK p.400), which applies in any country; the Canadian guide
    TP 12880 p.17 lists heading, ground speed and drift as the same navigation topics.
  source_chunk_id: faa-phak:PHAK p.400:0
  status: reviewed
  check:
    answer_index: 3
    faa_as_canadian: false
    reason: The passage says that with no wind, the aircraft's ground track is the same as
