- id: ppaer.aeronautics.056.q1
  exam: PPAER
  objective_id: ppaer.aeronautics.056
  stem: Which statement correctly describes the two basic types of drag acting on an aeroplane?
  choices:
  - Parasite drag is the drag that is not associated with the production of lift, while induced
    drag is a result of an airfoil developing lift.
  - Both parasite drag and induced drag are produced only when the wing is developing lift.
  - Induced drag is the drag that is not associated with the production of lift, while parasite
    drag is a result of an airfoil developing lift.
  - Parasite drag is produced only by the wing, while induced drag is produced only by the
    fuselage and engine cowlings.
  answer_index: 0
  explanation: 'Drag has two basic types: parasite drag, which does not aid flight and is
    not associated with lift production, and induced drag, which results from an airfoil developing
    lift. This is described in the PHAK drag discussion, which is background aerodynamics
    common to all countries.'
  source_chunk_id: faa-phak:PHAK p.103:0
  status: reviewed
  check:
    answer_index: 0
    faa_as_canadian: false
    reason: The passage gives two basic types of drag. Parasite drag is 'not associated with
      the production of lift', and induced drag 'is a result of an airfoil developing lift',
      which matches choice 0. Choice 2 swaps the two definitions. Choice 1 is contradicted
      because parasite drag is not tied to lift. Choice 3 is contradicted because parasite
      drag comes from cowlings, antennas and the shape of components. This is aerodynamics,
      so it applies the same in Canada.
- id: ppaer.aeronautics.065.q1
  exam: PPAER
  objective_id: ppaer.aeronautics.065
  stem: An aeroplane has an unaccelerated (1 G) stalling speed of 50 knots. If a manoeuvre
    imposes a load factor of 4 G, at approximately what speed will the aeroplane stall?
  choices:
  - 150 knots
  - 100 knots
  - 200 knots
  - 70 knots
  answer_index: 1
  explanation: Stalling speed increases with the square root of the load factor, so at 4 G
    the stall speed doubles (the square root of 4 is 2), giving 100 knots from a 50-knot base.
    This is the example in the PHAK passage on load factor and stall speed. It is aerodynamic
    physics that applies in any country, and the Canadian study guide lists this relationship
    as a topic.
  source_chunk_id: faa-phak:PHAK p.132:0
  status: reviewed
  check:
    answer_index: 1
    faa_as_canadian: false
    reason: The passage says an aircraft with a normal unaccelerated stalling speed of 50
      knots can be stalled at 100 knots by inducing a load factor of 4 G. This follows because
      stall speed rises with the square root of the load factor (√4 = 2). That is basic aerodynamics,
      so it applies the same way in Canada.
