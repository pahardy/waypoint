    reason: The TC AIM passage says that when a NOTAM subject is more than 5 NM from any aerodrome,
      item A) contains one or more flight information regions (up to 7). A subject 8 NM from
      the nearest aerodrome is beyond 5 NM, so choice 1 is correct. The aerodrome location
      indicator or CXXX is used only when the subject is 5 NM or less from an aerodrome or
      affects it directly.
