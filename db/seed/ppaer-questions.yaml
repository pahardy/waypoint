- id: ppaer.aeronautics.009.q1
  exam: PPAER
  objective_id: ppaer.aeronautics.009
  stem: In a typical certificated piston aeroplane engine with a dual ignition system, what
    is the effect if one of the two magnetos fails in flight?
  choices:
  - The engine continues to operate normally, with a slight decrease in power
  - The engine continues at full power because the second magneto compensates completely
  - The engine stops immediately because both magnetos are needed to fire the spark plugs
  - The engine runs only if the electrical system supplies current to the remaining spark
    plugs
  answer_index: 0
  explanation: In a dual ignition system each magneto operates independently and fires one
    of the two spark plugs in each cylinder. If one magneto fails the other is unaffected,
    so the engine keeps running normally with a slight loss of power. This is background aerodynamics-independent
    engine knowledge from the PHAK ignition system section.
  source_chunk_id: faa-phak:PHAK p.175:0
  status: reviewed
  check:
    answer_index: 0
    faa_as_canadian: false
    reason: The passage says that if one magneto fails, the other is unaffected and the engine
      keeps operating normally, with a slight decrease in power expected. Magnetos work independently
      of the electrical system, which rules out choice 3. This is engine system knowledge
      that applies everywhere, not a Canadian rule.
- id: ppaer.aeronautics.017.q1
  exam: PPAER
  objective_id: ppaer.aeronautics.017
  stem: As an aeroplane with a carburetted engine climbs to a higher altitude with the mixture
    control left in the FULL RICH position, what happens to the fuel-air mixture, and why?
  choices:
  - It becomes progressively leaner, because the fuel density decreases while air density
    remains the same
  - It becomes progressively richer, because air density decreases while fuel density remains
    the same
  - It becomes progressively leaner, because air density decreases faster than fuel is delivered
  - It stays the same, because the carburettor automatically meters fuel to match air density
  answer_index: 1
  explanation: Carburettors are calibrated at sea-level pressure. As altitude increases the
    air entering the carburettor becomes less dense while the fuel density stays the same,
    so the mixture becomes progressively richer unless it is leaned (PHAK p.168-169, background
    aerodynamics and engine principle).
  source_chunk_id: faa-phak:PHAK p.169:0
  status: reviewed
  check:
    answer_index: 1
    faa_as_canadian: false
    reason: The passage states that as altitude increases, the density of air entering the
      carburetor decreases while the density of the fuel stays the same. This makes the mixture
      progressively richer, which matches choice 1. This is engine physics, so it is not specific
      to any jurisdiction.
- id: ppaer.aeronautics.018.q1
  exam: PPAER
  objective_id: ppaer.aeronautics.018
  stem: A pilot climbs to a high-altitude airport in an aeroplane with a carburetted engine
    and leaves the mixture control in FULL RICH. Which of the following describes what happens
    to the fuel-air mixture as altitude increases?
  choices:
  - The mixture becomes leaner because the air bleed admits more air at altitude
  - The mixture becomes progressively richer because air density decreases while fuel density
    remains the same
  - The mixture stays at the correct ratio because the carburettor automatically compensates
    for altitude
  - The mixture becomes progressively leaner because fuel density decreases faster than air
    density
  answer_index: 1
  explanation: Carburettors are calibrated at sea-level pressure with the mixture control
    FULL RICH. As altitude increases, air density falls while fuel density stays the same,
    so the mixture gets progressively richer and must be leaned with the mixture control (PHAK,
    Mixture Control; background aerodynamics/engine physics).
  source_chunk_id: faa-phak:PHAK p.169:0
  status: reviewed
  check:
    answer_index: 1
    faa_as_canadian: false
    reason: The passage says that as altitude increases, the density of air entering the carburettor
      decreases while fuel density stays the same, giving a progressively richer mixture.
      That matches choice 1. This is engine physics, which is the same in Canada, so using
      an FAA source is acceptable.
