# Oral exercise. Key points are taken from the cited passages (TC AIM GEN 3.3,
# 3.3.1, 3.3.3 and 3.4: reporting to the Transportation Safety Board).
id: occurrence-reporting
exam: PSTAR
objective_id: pstar.regulations.014
prompt: >-
  Explain which accidents must be reported to the Transportation Safety
  Board of Canada, who must report them, how quickly, and what must be done
  with the evidence afterwards.
sources:
  - tc-aim:GEN 3.3:0
  - tc-aim:GEN 3.3.1:0
  - tc-aim:GEN 3.3.3:0
  - tc-aim:GEN 3.4:0
rubric:
  - id: accident
    description: The student states what makes an occurrence a reportable
      accident.
    weight: 2
    key_points:
      - A person is killed or seriously injured as a result of being on
        board or contact with the aircraft.
      - The aircraft sustains structural damage that adversely affects its
        strength, performance or flight characteristics.
      - The aircraft is missing or inaccessible.
  - id: who
    description: The student states who must report.
    weight: 1
    key_points:
      - The owner, operator, pilot-in-command, any crew member and any
        person providing air traffic services with direct knowledge of the
        occurrence.
  - id: when
    description: The student states how quickly to report.
    weight: 1
    key_points:
      - Report the available information as soon as possible by the
        quickest means available, and the rest within 30 days.
  - id: evidence
    description: The student states what to do with the evidence.
    weight: 1
    key_points:
      - Keep and preserve the evidence, except as needed to ensure the
        safety of persons, property or the environment.
