[project]
name = "waypoint-api"
version = "0.1.0"
description = "Waypoint backend API"
readme = "README.md"
authors = [
    { email = "hardy_patrick@yahoo.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.164.0",
    "psycopg[binary]>=3.3.9",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[project.scripts]
migrate = "waypoint_api.migrate:main"
