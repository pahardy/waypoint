[project]
name = "waypoint-api"
version = "0.1.0"
description = "Waypoint backend API"
readme = "README.md"
authors = [
    { email = "hardy_patrick@yahoo.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.11.0",
    "fastapi[standard]>=0.164.0",
    "psycopg[binary]>=3.3.9",
    "pyyaml>=6.0.3",
    "voyageai>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest]
testpaths = ["tests"]
# langsmith (via voyageai) warns on Python 3.14; not our code.
filterwarnings = ["ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 88

[project.scripts]
migrate = "waypoint_api.migrate:main"
seed = "waypoint_api.seed:main"
draft-questions = "waypoint_api.draft_questions:main"
oral = "waypoint_api.oral:main"
oral-eval = "waypoint_api.oral_eval:main"
scenario = "waypoint_api.run_scenario:main"
instructor = "waypoint_api.ask:main"
instructor-eval = "waypoint_api.instructor_eval:main"
